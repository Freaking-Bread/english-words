<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <title>Мои английские слова</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar__row">
        <h1 class="appbar__title">📘 Мои слова</h1>
        <div class="appbar__actions">
          <button id="btn-theme" class="icon-btn" title="Тема" aria-label="Сменить тему">🌙</button>
          <button id="btn-sync" class="icon-btn" title="Синхронизация" aria-label="Синхронизация">☁️</button>
          <button id="btn-edit" class="icon-btn" title="Режим редактирования" aria-label="Режим редактирования">✏️</button>
        </div>
      </div>

      <div class="progress">
        <div class="progress__bar"><span id="progress-fill" class="progress__fill"></span></div>
        <span id="progress-text" class="progress__text">0 / 0</span>
      </div>

      <div class="appbar__row appbar__tools">
        <input id="search" class="search" type="search" placeholder="Поиск слова или значения…" autocomplete="off" />
        <div class="chips" id="filters">
          <button class="chip is-active" data-filter="all">Все</button>
          <button class="chip" data-filter="learning">Учу</button>
          <button class="chip" data-filter="learned">Выучено</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="grid" class="grid" aria-live="polite"></div>
      <p id="empty" class="empty hidden">Ничего не найдено 🤔</p>
    </main>

    <button id="btn-add" class="fab" title="Добавить слово" aria-label="Добавить слово">＋</button>

    <!-- Модалка: добавить/редактировать слово -->
    <dialog id="word-dialog" class="dialog">
      <form method="dialog" class="dialog__form" id="word-form">
        <h2 id="word-dialog-title" class="dialog__title">Новое слово</h2>
        <label class="field">
          <span>Слово (English)</span>
          <input name="word" required placeholder="serendipity" />
        </label>
        <label class="field">
          <span>Моё значение / перевод / ассоциация</span>
          <textarea name="meaning" rows="2" placeholder="счастливая случайность…"></textarea>
        </label>
        <label class="field">
          <span>Своя фраза из фильма / контекст (необязательно)</span>
          <textarea name="example" rows="2" placeholder="цитата или пример употребления…"></textarea>
        </label>
        <div class="dialog__actions">
          <button type="button" class="btn btn--ghost" data-close>Отмена</button>
          <button type="submit" class="btn btn--primary">Сохранить</button>
        </div>
      </form>
    </dialog>

    <!-- Модалка: синхронизация с GitHub -->
    <dialog id="sync-dialog" class="dialog">
      <div class="dialog__form">
        <h2 class="dialog__title">☁️ Синхронизация</h2>
        <p class="muted" id="sync-status">Токен не задан — работаешь локально.</p>
        <label class="field">
          <span>GitHub Personal Access Token</span>
          <input id="token-input" type="password" placeholder="ghp_…" autocomplete="off" />
          <small class="hint">Хранится только в этом браузере. Нужен доступ <code>Contents: read/write</code> к репозиторию.</small>
        </label>
        <div class="sync-buttons">
          <button class="btn btn--ghost" id="btn-pull">⬇️ Загрузить из GitHub</button>
          <button class="btn btn--primary" id="btn-push">⬆️ Отправить в GitHub</button>
        </div>
        <div class="dialog__actions">
          <button type="button" class="btn btn--ghost" data-close>Закрыть</button>
          <button type="button" class="btn" id="btn-save-token">Сохранить токен</button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
